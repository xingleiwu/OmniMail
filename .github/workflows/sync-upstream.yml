name: Sync Upstream

on:
  schedule:
    # 每 2 小时从上游同步一次（GitHub 定时任务可能有十几分钟延迟）
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing repo secret SYNC_UPSTREAM_TOKEN (classic PAT with repo + workflow scopes)."
            exit 1
          fi
          BRANCH="${{ github.event.repository.default_branch }}"
          echo "Syncing ${{ github.repository }}@$BRANCH from mibgb65-cloud/OmniMail..."
          # 上游若改了 .github/workflows，必须用带 workflow 权限的 PAT，GITHUB_TOKEN 不够
          gh repo sync "${{ github.repository }}" --branch "$BRANCH"
          echo "Fork is up to date with upstream."
