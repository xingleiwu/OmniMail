name: Sync Upstream

on:
  schedule:
    # 每 6 小时从上游 mibgb65-cloud/OmniMail 同步一次
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.repository.default_branch }}"
          echo "Syncing ${{ github.repository }}@${BRANCH} from upstream..."
          if gh repo sync "${{ github.repository }}" --branch "${BRANCH}"; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "Fork is up to date with upstream."
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "Sync failed. The fork may have diverged and needs a manual merge."
            exit 1
          fi

      - name: Open issue when sync conflicts
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="上游同步冲突：需要手动合并 mibgb65-cloud/OmniMail"
          EXISTING="$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title 上游同步冲突" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open."
            exit 0
          fi
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$(cat <<'EOF'
          定时任务无法把上游 [mibgb65-cloud/OmniMail](https://github.com/mibgb65-cloud/OmniMail) 自动合并进本仓库。

          请到仓库页使用 **Sync fork → Update branch**，或本地执行：

          ```bash
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push origin main
          ```

          冲突解决后，Cloudflare Workers Builds 会在 `main` 更新后自动重新部署。
          EOF
          )"
